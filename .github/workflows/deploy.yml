name: Deploy Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

permissions:
  id-token: write   # needed for AWS OIDC login
  contents: read

jobs:
  deploy:
    name: Build and deploy to S3 + CloudFront
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_REGION: eu-west-1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Pass 1: hashed assets (safe to cache for a year).
      # HTML, sitemap.xml and robots.txt are excluded here so they are handled in pass 2.
      - name: Upload hashed assets to S3
        run: |
          aws s3 sync dist "s3://${{ secrets.S3_BUCKET }}" --delete \
            --exclude "*.html" \
            --exclude "sitemap.xml" \
            --exclude "robots.txt" \
            --cache-control "public,max-age=31536000,immutable"

      # Pass 2: everything else, always revalidated. Also removes stale HTML pages.
      - name: Upload HTML and metadata to S3
        run: |
          aws s3 sync dist "s3://${{ secrets.S3_BUCKET }}" --delete \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
